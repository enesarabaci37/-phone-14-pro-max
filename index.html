<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VektörSihirbazı</title>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --ink: #15171c; --muted: #6a7080; --line: #e2e5ec;
    --accent: #5b4cf0; --accent-ink: #ffffff; --chip: #eef0f5; --stage: #e9ebf0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #181b21; --ink: #eceef3; --muted: #9aa1b2; --line: #2a2f39;
      --accent: #7d70ff; --chip: #232731; --stage: #0b0c10; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  header .tag { color: var(--muted); font-size: 13px; }
  header .sp { flex: 1; }
  header button { white-space: nowrap; }
  @media (max-width: 560px) { header .tag { display: none; } }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px;
    padding: 8px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding: 0 16px 16px; height: calc(100% - 60px); min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }

  .viewer { position: relative; background: var(--stage); border-radius: 14px; overflow: hidden; min-height: 360px; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (max-width: 860px) { .viewer { height: 62vh; } }
  .checker { background-image: linear-gradient(45deg, rgba(128,128,128,.12) 25%, transparent 25%), linear-gradient(-45deg, rgba(128,128,128,.12) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(128,128,128,.12) 75%), linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.12) 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .stage > * { position: absolute; left: 0; top: 0; }
  .stage img { image-rendering: pixelated; }
  .stage svg { display: block; overflow: visible; }
  .divider { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); cursor: ew-resize; z-index: 5; }
  .divider::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent); color: #fff;
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .lbl { position: absolute; top: 10px; z-index: 4; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; pointer-events: none; }
  .toolbar { position: absolute; left: 10px; bottom: 10px; right: 10px; z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; padding: 6px 10px; border-radius: 7px; background: transparent; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .toolbar .sp { flex: 1; }
  .toolbar .zoom button { padding: 6px 10px; font-size: 13px; }

  .drop { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 8; cursor: pointer; padding: 20px; }
  .drop .box { border: 2px dashed var(--line); border-radius: 16px; padding: 36px 28px; max-width: 460px; background: var(--panel); }
  .drop .big { font-size: 40px; }
  .drop.hover .box { border-color: var(--accent); }
  .drop h2 { margin: 6px 0; font-size: 18px; }
  .drop p { margin: 0; color: var(--muted); font-size: 14px; }

  .busy { position: absolute; top: 10px; right: 10px; z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: 13px; display: none; min-width: 210px; }
  .busy.on { display: block; }
  .bar { height: 4px; background: var(--chip); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  aside { background: var(--panel); border-radius: 14px; padding: 14px; overflow: auto; border: 1px solid var(--line); }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
  aside h3:first-child { margin-top: 2px; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets button { flex-direction: column; padding: 10px 4px; font-size: 13px; gap: 2px; }
  .presets button span { font-size: 20px; }
  .presets button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .row label b { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 8px 0; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; }
  .check small { color: var(--muted); }
  .pal { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { position: relative; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); cursor: pointer; overflow: visible; }
  .sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .sw .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg);
    font-size: 11px; line-height: 18px; text-align: center; display: none; cursor: pointer; z-index: 2; }
  .sw:hover .x { display: block; }
  @media (hover: none) { .sw .x { display: block; } }
  .muted { color: var(--muted); font-size: 13px; }
  .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dl button { justify-content: center; }
  .stats { font-size: 12px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>✨ VektörSihirbazı</h1>
  <span class="tag">Bitmap → vektör (SVG, PDF, EPS)</span>
  <span class="sp"></span>
  <button id="openBtn">📂 Görsel aç</button>
  <input id="file" type="file" accept="image/*" hidden>
</header>
<main>
  <section class="viewer checker" id="viewer">
    <div class="stage" id="stage">
      <img id="origImg" alt="">
      <div id="vecLayer"></div>
    </div>
    <div class="divider" id="divider" hidden></div>
    <span class="lbl" id="lblL" style="left:10px" hidden>Orijinal</span>
    <span class="lbl" id="lblR" style="right:10px" hidden>Vektör</span>
    <div class="busy" id="busy"><span id="busyMsg">İşleniyor…</span><div class="bar"><i id="busyBar"></i></div></div>
    <div class="drop" id="drop">
      <div class="box">
        <div class="big">🖼️</div>
        <h2>Görseli buraya bırak</h2>
        <p>veya dokunup seç · yapıştırma (Ctrl/⌘+V) da çalışır<br>PNG, JPG, GIF, WebP, BMP</p>
      </div>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="seg" id="viewSeg">
        <button data-v="split" class="on">Karşılaştır</button>
        <button data-v="vec">Vektör</button>
        <button data-v="orig">Orijinal</button>
        <button data-v="line">Çizgiler</button>
      </div>
      <span class="sp"></span>
      <div class="seg zoom">
        <button id="zOut" title="Uzaklaştır">−</button>
        <button id="zFit" title="Sığdır">Sığdır</button>
        <button id="zIn" title="Yakınlaştır">+</button>
      </div>
    </div>
  </section>

  <aside>
    <h3>Görsel türü</h3>
    <div class="presets" id="presets">
      <button data-p="auto" class="on"><span>🎨</span>Logo / Çizim</button>
      <button data-p="photo"><span>📷</span>Fotoğraf</button>
      <button data-p="bw"><span>◐</span>Siyah-Beyaz</button>
    </div>

    <h3>Renkler</h3>
    <label class="check"><input type="checkbox" id="autoColors" checked> Renk sayısını otomatik bul</label>
    <div class="row" id="colorsRow" hidden>
      <label>Renk sayısı <b id="colorsV">8</b></label>
      <input type="range" id="colors" min="2" max="64" value="8">
    </div>
    <div class="row" id="sensRow">
      <label>Renk ayırma hassasiyeti <b id="sensV">14</b></label>
      <input type="range" id="sens" min="4" max="40" value="14">
    </div>
    <div class="row" id="thrRow" hidden>
      <label>Eşik <b id="thrV">Otomatik</b></label>
      <input type="range" id="thr" min="-1" max="100" value="-1">
    </div>
    <div class="pal" id="pal"></div>
    <p class="muted" id="palHint">Renge dokun: değiştir · × : rengi kaldır ve yeniden işle</p>
    <button id="palReset" hidden>↺ Paleti sıfırla</button>

    <h3>Şekil</h3>
    <div class="row">
      <label>Detay (leke temizleme) <b id="areaV">4 px²</b></label>
      <input type="range" id="area" min="0" max="200" value="4">
    </div>
    <div class="row">
      <label>Eğri toleransı <b id="tolV">0.50 px</b></label>
      <input type="range" id="tol" min="10" max="300" value="50">
    </div>
    <div class="row">
      <label>Köşe hassasiyeti <b id="cornV">130°</b></label>
      <input type="range" id="corn" min="60" max="175" value="130">
    </div>
    <div class="row">
      <label>Yumuşatma <b id="smV">3</b></label>
      <input type="range" id="sm" min="0" max="8" value="3">
    </div>

    <details>
      <summary>Gelişmiş</summary>
      <label class="check"><input type="checkbox" id="upscale" checked> Alt-piksel hassasiyeti <small>(küçük görseller)</small></label>
      <label class="check"><input type="checkbox" id="thin" checked> İnce çizgi / küçük yazı koruması</label>
      <label class="check"><input type="checkbox" id="blend" checked> Kenar karışımlarını düzelt</label>
      <label class="check"><input type="checkbox" id="denoise"> Gürültü azaltma <small>(fotoğraf)</small></label>
      <label class="check"><input type="checkbox" id="gap" checked> Şekiller arası ince boşlukları kapat</label>
    </details>

    <h3>İndir</h3>
    <div class="dl">
      <button class="primary" id="dlSvg" disabled>⬇ SVG</button>
      <button id="dlPdf" disabled>⬇ PDF</button>
      <button id="dlEps" disabled>⬇ EPS</button>
      <button id="dlPng" disabled>⬇ PNG (4×)</button>
    </div>
    <div class="stats" id="stats"></div>
  </aside>
</main>
<script src="vectorizer.js"></script>
<script src="app.js"></script>
</body>
</html>
