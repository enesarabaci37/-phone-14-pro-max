<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@500&display=block" rel="stylesheet">
<style>*{margin:0;padding:0}body{background:#999}#b{width:760px;height:100px;background:#F6EFE3;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:18px}
.band{position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,#B8312F 0 18px,#CFA14A 18px 24px,#1F3B5C 24px 42px,#CFA14A 42px 48px)}</style></head><body>
<div id="b"><div class="band" style="top:0"></div><div class="band" style="bottom:0"></div><span id="e1"></span>
<div style="text-align:center"><div style="font-family:'Cormorant Garamond';font-weight:700;font-size:40px;color:#3A2214;line-height:1">StitchAnatolia</div>
<div style="font-family:Inter;font-weight:500;font-size:12px;letter-spacing:.18em;color:#B8312F;margin-top:4px">THANK YOU · HAPPY STITCHING</div></div><span id="e2"></span></div>
<script>
const NAVY='#1F3B5C',RED='#B8312F',GOLD='#CFA14A',CREAM='#F3EBD3';
function eye(cell){const R=4,n=9;let s='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const d=Math.abs(x-R)+Math.abs(y-R);if(d>R)continue;const c=d>=4?NAVY:d>=2?RED:d>=1?GOLD:NAVY;
const x0=x*cell+cell*.16,y0=y*cell+cell*.16,x1=(x+1)*cell-cell*.16,y1=(y+1)*cell-cell*.16,sw=cell*.3;
s+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y0}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`;}
return `<svg width="${n*cell}" height="${n*cell}">${s}</svg>`;}
e1.innerHTML=eye(7);e2.innerHTML=eye(7);document.fonts.ready.then(()=>document.body.dataset.ready='1');
</script></body></html>
