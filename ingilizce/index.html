<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pip's House">
<meta name="theme-color" content="#7cc4f0">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Pip's House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Pip's House: İngilizce macera oyunu (2. sınıf, 2. dönem: Family Life, Homes, Pets, Food & Meals + tekrar).
   Her şey İngilizce okunur; 🇹🇷 düğmesi Türkçesini gösterir. Tek oyun dünyası görünümü, renkler burada. */
:root{
  --sky:#7cc4f0; --sky2:#bfe5fb; --grass:#7ccf6a; --paper:#fffdf6; --paper2:#f4efe2;
  --ink:#1f3347; --muted:#5b7083; --pip:#22a866; --pip2:#178a52;
  --sun:#ffc23c; --coral:#ff6b57; --grape:#8a5cd6; --blue:#3399e6;
  --ok:#22a866; --no:#e5484d;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --gx:max(14px,env(safe-area-inset-left,0px)); --gxr:max(14px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:linear-gradient(var(--sky) 0,var(--sky2) 55%,#dff3d6 100%) fixed;color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gxr) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gx)}

/* üst çubuk */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rbtn{width:50px;height:50px;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-size:24px;flex:none;
  box-shadow:0 4px 0 rgba(31,51,71,.2);font-family:var(--display);font-weight:800}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,51,71,.2)}
.rbtn.off{opacity:.55}
.rbtn.wide{width:auto;padding:0 14px;gap:6px;display:flex;align-items:center;font-size:22px}
.htitle{flex:1;min-width:0;font-family:var(--display);font-size:26px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(31,51,71,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{display:block;font-family:var(--body);font-size:13px;text-shadow:none;color:var(--ink);opacity:.75}

/* harita */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.place{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border-radius:22px;padding:12px 14px;min-height:92px;
  box-shadow:0 6px 0 rgba(31,51,71,.18)}
.place:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,51,71,.18)}
.place .pi{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:38px;background:var(--c)}
.place .pt{flex:1;min-width:0}
.place b{display:block;font-family:var(--display);font-size:23px;line-height:1.05}
.place small{display:block;color:var(--muted);font-size:14px}
.place .pst{font-size:18px;letter-spacing:1px;color:#d9cfb6}
.place .pst i{font-style:normal}.place .pst i.on{color:var(--sun)}
.place .num{position:absolute;top:-8px;left:-6px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-family:var(--display)}
.place.lock{filter:grayscale(1);opacity:.6}
.place.lock .pi::after{content:"🔒";position:absolute;font-size:22px;transform:translate(22px,22px)}
.place.next{box-shadow:0 0 0 4px var(--sun),0 6px 0 rgba(31,51,71,.18);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,194,60,.55),0 6px 0 rgba(31,51,71,.18)}}
.mapintro{display:flex;align-items:center;gap:12px;background:rgba(255,253,246,.9);border-radius:20px;padding:10px 14px;margin-bottom:14px;box-shadow:0 4px 0 rgba(31,51,71,.12)}
.mapintro .pipbig{font-size:52px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mapintro p{margin:0;font-size:17px;line-height:1.35}
.mapintro p small{display:block;color:var(--muted);font-size:14px}

/* oyun alanı */
.bar{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:22px;padding:8px 10px 8px 8px;box-shadow:0 5px 0 rgba(31,51,71,.18);margin-bottom:10px;min-height:76px}
.bar .pip{font-size:46px;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
.bar .pip.talk{animation:talk .3s ease-in-out 4}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes talk{50%{transform:scale(1.12) rotate(4deg)}}
.say{flex:1;min-width:0}
.say .en{font-family:var(--display);font-size:clamp(21px,4.6vw,30px);line-height:1.12}
.say .en b{color:var(--grape)}
.say .tr{font-size:15px;color:var(--muted);margin-top:2px}
.ibtn{flex:none;width:52px;height:52px;border-radius:50%;background:var(--paper2);font-size:24px;display:grid;place-items:center}
.ibtn:active{transform:scale(.94)}
.ibtn.on{background:#ffe9b0}
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 10px}
.dots i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.7)}
.dots i.cur{background:var(--ink)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--sun)}

.scene{position:relative;width:min(100%,calc((100vh - var(--res,250px))*4/3));aspect-ratio:4/3;margin:0 auto;border-radius:24px;overflow:hidden;
  background:#fbf3e4;box-shadow:0 6px 0 rgba(31,51,71,.18);touch-action:none;font-size:var(--u,8px)}
.scene.tall{aspect-ratio:4/3.4;width:min(100%,calc((100vh - var(--res,250px))*4/3.4))}
.scene.ui{--res:370px}
.it{position:absolute;transform:translate(-50%,-100%);font-size:9em;line-height:1;display:grid;place-items:center;transition:left .45s,top .45s,transform .2s;
  font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.it.tap{cursor:pointer}
.it.hl{filter:drop-shadow(0 0 .12em #fff) drop-shadow(0 0 .2em var(--sun));animation:pulse .9s ease-in-out infinite}
.it.okp{animation:pop .45s}
.it.nop{animation:shake .4s}
@keyframes pulse{50%{transform:translate(-50%,-100%) scale(1.12)}}
@keyframes pop{0%{transform:translate(-50%,-100%) scale(.6)}70%{transform:translate(-50%,-100%) scale(1.2)}100%{transform:translate(-50%,-100%) scale(1)}}
@keyframes shake{25%{transform:translate(-60%,-100%)}75%{transform:translate(-40%,-100%)}}
.lbl{position:absolute;transform:translate(-50%,0);font-family:var(--display);font-size:3.2em;line-height:1;background:rgba(255,255,255,.85);border-radius:1em;padding:.15em .5em;white-space:nowrap;pointer-events:none}
.badge{position:absolute;font-size:.45em;right:-.25em;top:-.25em}

/* odalar */
.room{position:absolute;border:.5em solid #8b5a2b;display:flex;align-items:flex-end;justify-content:space-around;padding:0 .8em 1em;font-size:6em;line-height:1;cursor:pointer;
  font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.room span{font-size:1em}
.room.okp{animation:roomok .6s}.room.nop{animation:roomno .4s}
@keyframes roomok{50%{filter:brightness(1.25)}}
@keyframes roomno{25%{transform:translateX(-1%)}75%{transform:translateX(1%)}}
.roof{position:absolute;left:4%;right:28%;top:3%;height:16%;background:#e5484d;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:var(--grass)}

/* mobilya (in / on / under) */
.fur{position:absolute}
.tbl .top{position:absolute;left:0;right:0;top:0;height:14%;background:#b5763b;border-radius:.6em;box-shadow:inset 0 -.6em 0 rgba(0,0,0,.15)}
.tbl .lg{position:absolute;top:10%;bottom:0;width:7%;background:#8b5a2b;border-radius:.3em}
.chr .back{position:absolute;left:4%;width:18%;top:0;height:52%;background:#3399e6;border-radius:.6em .6em 0 0}
.chr .seat{position:absolute;left:0;right:0;top:46%;height:12%;background:#2b82c9;border-radius:.5em}
.chr .lg{position:absolute;top:52%;bottom:0;width:11%;background:#1f5f94;border-radius:.3em}
.bed .head{position:absolute;left:0;width:9%;top:0;bottom:0;background:#8a5cd6;border-radius:1em 1em .2em .2em}
.bed .mat{position:absolute;left:5%;right:0;top:34%;height:22%;background:#fff;border:.4em solid #c9b8ef;border-radius:.8em}
.bed .pil{position:absolute;left:10%;width:18%;top:24%;height:14%;background:#ffe3ee;border-radius:1em}
.bed .lg{position:absolute;top:55%;bottom:0;width:6%;background:#6a42b0;border-radius:.3em}
.box .front{position:absolute;inset:0;background:#c98c4a;border-radius:.4em;box-shadow:inset 0 .8em 0 rgba(0,0,0,.18);z-index:5}
.box .flap{position:absolute;top:-18%;width:46%;height:22%;background:#d9a066;border-radius:.3em}
.zone{position:absolute;border-radius:1em}
.zone.hot{background:rgba(255,194,60,.35);outline:.3em dashed var(--sun)}
.inbox{z-index:4}

/* tepsi ve sürükleme */
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
.titem{width:84px;height:84px;border-radius:20px;background:var(--paper);box-shadow:0 5px 0 rgba(31,51,71,.18);font-size:48px;display:grid;place-items:center;touch-action:none;position:relative}
.titem small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--body);font-size:12px;color:var(--muted)}
.titem.sel{box-shadow:0 0 0 4px var(--sun),0 5px 0 rgba(31,51,71,.18)}
.titem.used{opacity:.3}
.titem.nop{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ghost{position:fixed;z-index:90;pointer-events:none;font-size:64px;line-height:1;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}

/* seçenekler */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:18px;padding:8px 10px;min-height:64px;box-shadow:0 5px 0 rgba(31,51,71,.18);text-align:left}
.opt .oi{font-size:34px;line-height:1;flex:none}
.opt .ot{flex:1;font-family:var(--display);font-size:22px;line-height:1.1}
.opt .os{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:19px}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:#fde0df;animation:shk .4s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(31,51,71,.18)}

/* market sepeti */
.basket{position:absolute;right:2%;bottom:4%;width:28%;height:34%;background:#d9a066;border-radius:1em 1em 2.5em 2.5em;border:.5em solid #a8743f;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:.2em;padding:.6em;font-size:4.4em;line-height:1;overflow:hidden}
.basket::before{content:"";position:absolute;left:10%;right:10%;top:-.9em;height:1.2em;border:.12em solid #a8743f;border-bottom:0;border-radius:2em 2em 0 0}
.crate{position:absolute;width:20%;height:24%;background:#e8c08a;border-radius:.8em;border:.4em solid #b9864c;display:grid;place-items:center;font-size:7em;cursor:pointer;line-height:1}
.crate.okp{animation:roomok .4s}
.crate .cn{position:absolute;bottom:-.1em;right:.1em;font-size:.3em;font-family:var(--display);color:#6b4426}

/* boyama */
.hs{position:absolute;cursor:pointer;transition:background .3s}
.hs.blank{background:#fff;outline:.35em dashed #c9c1ad;outline-offset:-.35em}
.pal{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.pc{width:58px;height:58px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 4px 0 rgba(31,51,71,.18)}
.pc.sel{box-shadow:0 0 0 4px var(--ink),0 4px 0 rgba(31,51,71,.18);transform:scale(1.08)}

/* kelime kartları */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wc{background:var(--paper);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(31,51,71,.18);min-height:140px;justify-content:center}
.wc .e{font-size:52px;line-height:1.1}.wc b{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--grape);text-align:center}
.wc small{color:var(--muted);font-size:14px;visibility:hidden}.trOn .wc small{visibility:visible}
.wc.seen{background:#eefaf2}
.wc:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(31,51,71,.18)}
.wc.pop{animation:wpop .4s}
@keyframes wpop{50%{transform:scale(1.08)}}
.go{display:block;margin:16px auto 0;background:var(--pip);color:#fff;font-family:var(--display);font-size:24px;border-radius:999px;padding:12px 34px;min-height:58px;box-shadow:0 5px 0 var(--pip2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pip2)}
.go.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 rgba(31,51,71,.18)}

/* pencere / modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(31,51,71,.45);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--paper);border-radius:28px;padding:22px 20px;width:100%;max-width:430px;text-align:center;animation:mpop .35s}
@keyframes mpop{0%{transform:scale(.7)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.mbox h3{font-family:var(--display);font-size:34px;margin:4px 0;line-height:1.05}
.mbox p{margin:0 0 12px;color:var(--muted)}
.mstars{font-size:52px;letter-spacing:4px;line-height:1;color:#e6dcc4}.mstars i{font-style:normal}.mstars i.on{color:var(--sun)}
.stk{font-size:76px;line-height:1;margin:6px 0;animation:mpop .5s .3s both}
.mbtns{display:grid;gap:10px;margin-top:10px}
.mb{border-radius:16px;padding:12px;font-family:var(--display);font-size:21px;background:var(--paper2);min-height:54px}
.mb.main{background:var(--pip);color:#fff;box-shadow:0 4px 0 var(--pip2)}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.album span{aspect-ratio:1;border-radius:16px;background:var(--paper2);display:grid;place-items:center;font-size:40px}
.album span.no{font-size:22px;color:#cfc6b0}

/* açılış */
#splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(var(--sky),var(--sky2))}
#splash .logo{font-family:var(--display);font-weight:800;font-size:clamp(52px,13vw,96px);line-height:.9;color:#fff;text-shadow:0 4px 0 var(--pip2),0 9px 0 rgba(0,0,0,.18)}
#splash .logo span{display:block;color:var(--sun);font-size:.42em;text-shadow:0 3px 0 #b07a00}
#splash .bird{font-size:clamp(90px,24vw,150px);line-height:1.1;animation:bob 2.4s ease-in-out infinite}
#splash p{margin:12px 0 0;font-size:17px;color:var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@media (max-width:520px){.htitle{font-size:21px}.titem{width:70px;height:70px;font-size:40px}.bar .pip{font-size:38px}.ibtn{width:46px;height:46px;font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <button class="rbtn" id="homeBtn" aria-label="Back to Ders Bahçesi">‹</button>
    <div class="htitle" id="htitle">Pip's House<small>İngilizce macera</small></div>
    <button class="rbtn wide" id="albumBtn" aria-label="Sticker book">⭐ <b id="starN">0</b></button>
    <button class="rbtn" id="trBtn" aria-label="Türkçe ipuçları">🇹🇷</button>
    <button class="rbtn" id="sndBtn" aria-label="Sound on or off">🔊</button>
  </div>
  <main id="view"></main>
</div>
<div id="ghost" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="splash">
  <div>
    <div class="bird">🦜</div>
    <div class="logo">Pip's<span>House</span></div>
    <button class="go" id="playBtn">Let's play! ▶</button>
    <p>Hello! I'm Pip. Let's learn English together!<br><small>Merhaba! Ben Pip. Hadi birlikte İngilizce öğrenelim!</small></p>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
(()=>{
'use strict';
/* ================= yardımcılar ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=n=>Math.floor(Math.random()*n), ri=(a,b)=>a+rnd(b-a+1), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const cap=s=>s[0].toUpperCase()+s.slice(1);
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const NUMTR=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz','on'];
let gen=0;const later=(fn,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)fn()},ms)};
const embedded=window.top!==window;

/* ================= kayıt ================= */
const SKEY='pips-house-v1',MKEY='ders-bahcesi-v1';
const fresh=()=>({v:1,stars:{},plays:{},stickers:[],seen:{},tr:false,muted:false});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&s.v===1)S=Object.assign(fresh(),s)}catch(e){}
try{const m=JSON.parse(localStorage.getItem(MKEY)||'null');if(m)S.muted=!!m.muted}catch(e){}
const persist=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
function mainSave(fn){try{const m=JSON.parse(localStorage.getItem(MKEY)||'null')||{level:{},stars:{},stats:{},review:{},seen:{},muted:false,voice:true,day:null};fn(m);localStorage.setItem(MKEY,JSON.stringify(m))}catch(e){}}
function credit(stars){mainSave(m=>{
  const d=today();if(!m.day||m.day.d!==d)m.day={d,rounds:0,stars:0,qs:0};m.day.rounds++;m.day.stars+=stars;m.day.qs+=6;
  m.stars=m.stars||{};m.level=m.level||{};const st=m.stars.pip={};CH.forEach((c,i)=>{if(S.stars[c.id])st[i+1]=S.stars[c.id]});
  m.level.pip=Math.min(unlocked()+1,CH.length);
})}

/* ================= ses ================= */
let actx=null;
function tone(f,dur=.15,type='sine',vol=.14,when=0){
  if(S.muted)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}
const sfx={tap:()=>tone(560,.07,'triangle',.07),good:()=>{tone(660,.12);tone(880,.16,'sine',.14,.1)},bad:()=>tone(200,.22,'sawtooth',.04),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.12)),pop:()=>tone(780,.06,'sine',.08)};
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const V={en:null,tr:null};
function pickVoices(){if(!TTS)return;try{const vs=speechSynthesis.getVoices()||[];
  const best=re=>{const c=vs.filter(v=>re.test((v.lang||'').replace('_','-')));return c.find(v=>/enhanced|premium|geliştirilmiş/i.test(v.name))||c.find(v=>/Samantha|Karen|Moira|Tessa|Google US/i.test(v.name))||c.find(v=>v.localService)||c[0]||null};
  V.en=best(/^en-US/i)||best(/^en-GB/i)||best(/^en/i);V.tr=best(/^tr(-|$)/i)}catch(e){}}
if(TTS){pickVoices();try{speechSynthesis.addEventListener('voiceschanged',pickVoices)}catch(e){}}
const clean=t=>String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,' ').replace(/\s+/g,' ').trim();
/* say([['Hello','en'],['Merhaba','tr']]) ya da say('Hello') */
function say(segs){
  if(!TTS||S.muted)return;if(typeof segs==='string')segs=[[segs,'en']];
  try{speechSynthesis.cancel();segs.forEach(([t,l])=>{const x=clean(t);if(!x)return;const u=new SpeechSynthesisUtterance(x);
    u.lang=l==='tr'?'tr-TR':'en-US';const v=V[l==='tr'?'tr':'en'];if(v)u.voice=v;u.rate=l==='tr'?.95:.82;u.pitch=1.08;speechSynthesis.speak(u)})}catch(e){}
  const p=$('.bar .pip');if(p){p.classList.remove('talk');void p.offsetWidth;p.classList.add('talk')}
}
const hush=()=>{try{if(TTS)speechSynthesis.cancel()}catch(e){}};
document.addEventListener('pointerdown',()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}},{capture:true});

/* ---------- tur ---------- */
const ROUND=6;
function startCh(i){
  const c=CH[i];
  if(!S.seen[c.id])return showWords(i,()=>runRound(i));
  runRound(i);
}
function runRound(i){
  gen++;closeModal();const c=CH[i],k=S.plays[c.id]||0;
  cur={i,c,k,q:0,miss:0,res:[]};
  $('#htitle').innerHTML=`${c.name}<small>${c.tr}</small>`;
  next();
}
function next(){
  gen++;hush();const {c,k}=cur;
  if(cur.q>=ROUND)return finish();
  view.innerHTML='';
  const bar=el('div','bar');bar.innerHTML=`<span class="pip">🦜</span><div class="say"><div class="en"></div><div class="tr"${S.tr?'':' hidden'}></div></div>`;
  const sb=el('button','ibtn','🔊');sb.setAttribute('aria-label','Listen again');
  const wb=el('button','ibtn','📖');wb.setAttribute('aria-label','Words');wb.onclick=()=>{sfx.tap();const s=cur;showWords(s.i,()=>runRoundResume(s))};
  bar.append(sb,wb);
  const dots=el('div','dots');for(let j=0;j<ROUND;j++)dots.append(el('i',j<cur.q?(cur.res[j]?'ok':'no'):j===cur.q?'cur':''));
  const stage=el('div');
  view.append(bar,dots,stage);
  let tries=0,done=false,line=null;
  const api={
    set(en,tr){line=[en,tr];bar.querySelector('.en').innerHTML=en;bar.querySelector('.tr').innerHTML=tr;sb.onclick=()=>say(en)},
    speak(){say(line[0])},
    right(after=900){if(done)return;done=true;sfx.good();cur.res[cur.q]=tries===0;
      const p=pick(['Great!','Well done!','Super!','Yes!','Good job!','Excellent!']);say(p);dots.children[cur.q].className=tries?'no':'ok';
      cur.q++;later(next,after+(tries?300:0))},
    wrong(show){if(done)return;tries++;cur.miss++;sfx.bad();
      if(tries===1){say([['Oops! Listen again.','en'],[line[0],'en']]);return false}
      done=true;cur.res[cur.q]=false;dots.children[cur.q].className='no';
      say([['Look! Here it is.','en']]);if(show)show();cur.q++;later(next,2200);return true},
    get tries(){return tries},get done(){return done},k,
  };
  MISSION[c.id](stage,api,c.gen(k),k);
  const sc=stage.querySelector('.scene');if(sc&&stage.querySelector('.tray,.opts,.pal,.go'))sc.classList.add('ui');
  later(()=>api.speak(),250);syncHud();
}
function runRoundResume(s){gen++;cur=s;$('#htitle').innerHTML=`${s.c.name}<small>${s.c.tr}</small>`;next()}
function finish(){
  const {c,i,miss}=cur,stars=miss===0?3:miss<=2?2:1;
  const first=!S.stars[c.id];S.stars[c.id]=Math.max(S.stars[c.id]||0,stars);S.plays[c.id]=(S.plays[c.id]||0)+1;
  let newSticker=false;if(!S.stickers.includes(c.id)){S.stickers.push(c.id);newSticker=true}
  persist();credit(stars);sfx.win();confetti();
  const nx=i+1<CH.length?CH[i+1]:null;
  const praise=stars===3?'Amazing!':stars===2?'Great job!':'Good try!';
  openModal(`<div class="mstars">${[0,1,2].map(j=>`<i class="${j<stars?'on':''}">★</i>`).join('')}</div><h3>${praise}</h3>
    ${newSticker?`<div class="stk">${c.sticker}</div><p>New sticker!<br><small>Yeni çıkartma kazandın!</small></p>`:`<p>${stars<3?'Play again for 3 stars!':'You are a star!'}<br><small>${stars<3?'3 yıldız için tekrar oyna!':'Sen bir yıldızsın!'}</small></p>`}
    <div class="mbtns">${nx?`<button class="mb main" data-a="next">${first?'New place':'Next place'}: ${nx.name} ▶</button>`:''}
    <button class="mb ${nx?'':'main'}" data-a="again">Play again</button><button class="mb" data-a="map">🗺️ Map</button></div>`,
    {next:()=>{closeModal();startCh(i+1)},again:()=>runRound(i),map:showMap});
  say([[praise,'en'],[newSticker?'You got a new sticker!':'','en']]);
}

/* sürükle ya da dokun-seç-bırak */
function dragger(tray,getZone,onDrop){
  let sel=null;
  const ghost=$('#ghost');
  tray.querySelectorAll('.titem').forEach(t=>{
    let sx=0,sy=0,moving=false,id=null;
    t.addEventListener('pointerdown',e=>{if(t.classList.contains('used'))return;sx=e.clientX;sy=e.clientY;moving=false;id=e.pointerId;try{t.setPointerCapture(id)}catch(_){}e.preventDefault()});
    t.addEventListener('pointermove',e=>{if(id!==e.pointerId)return;if(!moving&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){moving=true;ghost.innerHTML=t.dataset.e;ghost.hidden=false}
      if(moving){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const z=getZone(e.clientX,e.clientY);document.querySelectorAll('.zone.hot,.hs.hot').forEach(x=>x.classList.remove('hot'));if(z&&z.el)z.el.classList.add('hot')}});
    const end=e=>{if(id!==e.pointerId)return;id=null;document.querySelectorAll('.zone.hot').forEach(x=>x.classList.remove('hot'));
      if(moving){ghost.hidden=true;const z=getZone(e.clientX,e.clientY);if(z)onDrop(t,z);moving=false;return}
      if(t.classList.contains('used'))return;
      tray.querySelectorAll('.titem').forEach(x=>x.classList.toggle('sel',x===t&&sel!==t));sel=sel===t?null:t;sfx.pop();

  const icons={sunny:['☀️'],rainy:['🌧️','💧','💧'],snowy:['❄️','❄️','⛄'],windy:['🌬️','🍃','🍃'],cloudy:['☁️','☁️']}[w];
  icons.forEach((e,j)=>{const it=item(s,e,14+j*12+(j?0:6),j?52:40,j?6:14);it.style.zIndex=2});
  return s;
}
MISSION.clothes=(stage,api,t,k)=>{
  const w=fresh1(()=>pick(Object.keys(WEATHER)),x=>x),s=weatherScene(w);
  const pip=item(s,'🦜',72,80,26);
  if(t==='weather'){
    api.set(`Look outside! What is the weather like?`,`Dışarı bak! Hava nasıl?`);
    const opts=shuffle([w,...shuffle(Object.keys(WEATHER).filter(x=>x!==w)).slice(0,2)]);
    const box=options(opts.map(x=>({ico:WEATHER[x][0],txt:`It is ${x}.`,val:x})),(o,b)=>{if(api.done)return;say(o.txt);if(o.val===w){b.classList.add('ok');api.right(1300)}else{b.classList.add('no');api.wrong(()=>opts.forEach((x,j)=>{if(x===w)box.children[j].classList.add('ok')}))}});
    stage.append(s,box);return;
  }
  const need=t==='wear2'?shuffle(WEAR[w]).slice(0,2):[pick(WEAR[w])];
  api.set(`It is <b>${w}</b>! Put on your ${need.map(x=>`<b>${x}</b>`).join(' and ')}.`,`${WTR[w]} ${need.map(x=>CLOTHES[x][1]).join(' ve ')} giy.`);
  const wrongs=shuffle(Object.keys(CLOTHES).filter(x=>!WEAR[w].includes(x))).slice(0,5-need.length);
  const pool=shuffle([...need,...wrongs]);
  const tray=el('div','tray');pool.forEach(c=>tray.append(trayItem(CLOTHES[c][0],c,CLOTHES[c][1])));
  const zone=el('div','zone');zone.style.cssText='left:52%;top:20%;width:42%;height:64%';s.append(zone);
  const got=new Set();
  const getZone=(cx,cy)=>{const r=zone.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom?{el:zone}:null};
  const drop=tEl=>{if(api.done)return;const c=tEl.dataset.w;
    if(need.includes(c)&&!got.has(c)){got.add(c);tEl.classList.add('used');const it=item(s,CLOTHES[c][0],60+got.size*9,48+got.size*12,9);it.style.zIndex=5;flash(it,1);say(`The ${c}. Thank you!`);
      if(got.size===need.length)later(()=>api.right(1300),300)}
    else{tEl.classList.add('nop');later(()=>tEl.classList.remove('nop'),400);say(WEAR[w].includes(c)?`Yes, but I want my ${need.filter(x=>!got.has(x)).join(' and ')}.`:`No! Not the ${c}. It is ${w}!`);
      api.wrong(()=>tray.querySelectorAll('.titem').forEach(x=>{if(need.includes(x.dataset.w)&&!got.has(x.dataset.w))x.classList.add('sel')}))}};
  const d=dragger(tray,getZone,drop);zone.addEventListener('pointerup',()=>{const tEl=d.take();if(tEl)drop(tEl)});
  stage.append(s,tray);
};

MISSION.paint=(stage,api,t,k)=>{
  const s=sceneEl();s.style.background='linear-gradient(#bfe5fb 0 80%,var(--grass) 80%)';
  const P={wall:'left:22%;top:38%;width:50%;height:44%',roof:'left:16%;top:12%;width:62%;height:28%;clip-path:polygon(50% 0,100% 100%,0 100%)',
    door:'left:40%;top:56%;width:14%;height:26%;border-radius:2em 2em 0 0',window:'left:27%;top:47%;width:10%;height:13%;border-radius:.6em',window2:'left:57%;top:47%;width:10%;height:13%;border-radius:.6em'};
  const parts={};
  Object.entries(P).forEach(([p,css])=>{const d=el('div','hs blank');d.style.cssText+=css;d.dataset.p=p==='window2'?'window':p;s.append(d);parts[p]=d});
  parts.wall.style.zIndex=1;parts.roof.style.zIndex=2;parts.door.style.zIndex=3;parts.window.style.zIndex=3;parts.window2.style.zIndex=3;
  item(s,'🌳',88,82,16);item(s,'☀️',90,22,10);
  const names=['door','window','roof','wall'],cols=Object.keys(COLORS);
  const steps=(t==='paint2'?shuffle(names).slice(0,2):[fresh1(()=>pick(names),x=>x)]).map(p=>[p,pick(cols.filter(c=>c!=='white'))]);
  const trp={door:'kapıyı',window:'pencereleri',roof:'çatıyı',wall:'duvarı'};
  api.set(`Paint ${steps.map(([p,c])=>`the ${p}${p==='window'?'s':''} <b style="color:${COLORS[c][0]};${c==='yellow'?'text-shadow:0 0 2px #444':''}">${c}</b>`).join(' and ')}.`,
    `${steps.map(([p,c])=>`${cap(trp[p])} ${COLORS[c][1]}`).join(', ')} renge boya.`);
  let col=null,si=0;
  const pal=el('div','pal');
  cols.forEach(c=>{const b=el('button','pc');b.style.background=COLORS[c][0];b.setAttribute('aria-label',c);b.onclick=()=>{col=c;[...pal.children].forEach(x=>x.classList.toggle('sel',x===b));say(c)};pal.append(b)});
  Object.values(parts).forEach(d=>d.onclick=()=>{
    if(api.done)return;const p=d.dataset.p;
    if(!col){say('First, pick a color!');sfx.bad();return}
    const targets=Object.values(parts).filter(x=>x.dataset.p===p);
    targets.forEach(x=>{x.classList.remove('blank');x.style.background=COLORS[col][0]});
    const [tp,tc]=steps[si];
    if(p===tp&&col===tc){sfx.good();say(`A ${col} ${p}!`);si++;if(si>=steps.length)later(()=>api.right(1300),300)}
    else{say(p!==tp?`That is the ${p}.`:`That is ${col}.`);
      const shown=api.wrong(()=>{Object.values(parts).filter(x=>x.dataset.p===tp).forEach(x=>{x.classList.remove('blank');x.style.background=COLORS[tc][0]})});
      if(!shown)later(()=>targets.forEach(x=>{x.classList.add('blank');x.style.background=''}),900)}
  });
  stage.append(s,pal);
};

/* ================= konfeti ================= */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx'),ctx=cv.getContext('2d'),d=devicePixelRatio||1,W=cv.width=innerWidth*d,H=cv.height=innerHeight*d;
  const cs=['#FF6B57','#FFC23C','#22A866','#3399E6','#8A5CD6'];
  const ps=[...Array(120)].map(()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*W*.035,vy:-Math.random()*H*.028-H*.006,s:(5+Math.random()*7)*d,c:cs[rnd(5)],r:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0009;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}
