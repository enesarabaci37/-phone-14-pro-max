<!DOCTYPE html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Apartman Yönetimi</title>
<style>
  :root {
    --bg: #f4f5f7; --kart: #ffffff; --yazi: #1d2330; --soluk: #6b7280; --cizgi: #e3e6eb;
    --ana: #1f5fbf; --ana-koyu: #174a94; --yesil: #1e8e3e; --kirmizi: #d62828; --turuncu: #c76a00;
    --yesil-acik: #e7f5ec; --kirmizi-acik: #fdecec; --mavi-acik: #e8f0fb; --turuncu-acik: #fff3e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--yazi);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .gizli { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--ana); color: #fff;
    display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 10px;
    padding: 6px 10px; font-size: 18px; cursor: pointer; }

  main { padding: 14px 14px 96px; max-width: 760px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: #fff; border-top: 1px solid var(--cizgi);
    display: flex; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; background: none; border: 0; padding: 6px 2px; font-size: 11.5px; color: var(--soluk);
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  nav button span { font-size: 21px; line-height: 1; }
  nav button.secili { color: var(--ana); font-weight: 600; }

  h2 { font-size: 20px; margin: 4px 0 12px; }
  h3 { font-size: 16px; margin: 18px 0 8px; color: var(--soluk); text-transform: uppercase; letter-spacing: .03em; }
  .kart { background: var(--kart); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .satir { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .satir + .satir { margin-top: 6px; }
  .buyuk { font-size: 28px; font-weight: 700; }
  .orta { font-size: 20px; font-weight: 700; }
  .soluk { color: var(--soluk); font-size: 14px; }
  .kucuk { font-size: 13px; }
  .yesil { color: var(--yesil); } .kirmizi { color: var(--kirmizi); } .turuncu { color: var(--turuncu); }
  .etiket { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .etiket.borc { background: var(--kirmizi-acik); color: var(--kirmizi); }
  .etiket.alacak { background: var(--yesil-acik); color: var(--yesil); }
  .etiket.tamam { background: #eef0f3; color: var(--soluk); }
  .uyari { background: var(--turuncu-acik); border-left: 4px solid var(--turuncu); }
  .bilgi { background: var(--mavi-acik); border-left: 4px solid var(--ana); }
  .ilerleme { height: 10px; background: #eef0f3; border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .ilerleme div { height: 100%; background: var(--yesil); }

  .liste { background: var(--kart); border-radius: 14px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .liste > div { padding: 12px 16px; border-bottom: 1px solid var(--cizgi); }
  .liste > div:last-child { border-bottom: 0; }
  .liste .tikla { cursor: pointer; }
  .liste .tikla:active { background: #f0f3f8; }
  .bos { text-align: center; color: var(--soluk); padding: 22px 10px !important; }

  .dugmeler { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .btn { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 600; cursor: pointer; background: #e9edf3;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--yazi); }
  .btn.ana { background: var(--ana); color: #fff; }
  .btn.yesil { background: var(--yesil); color: #fff; }
  .btn.kirmizi { background: var(--kirmizi); color: #fff; }
  .btn.cerceve { background: #fff; border: 1px solid var(--cizgi); }
  .btn.tam { width: 100%; }
  .btn.kucuk { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .5; }
  .izgara2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  label.alan { display: block; margin-bottom: 12px; }
  label.alan > span { display: block; font-size: 14px; color: var(--soluk); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #cfd5de; border-radius: 10px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ana); border-color: transparent; }
  textarea { min-height: 80px; resize: vertical; }
  .secenekler { display: flex; gap: 6px; flex-wrap: wrap; }
  .secenekler label { flex: 1; min-width: 90px; }
  .secenekler input { display: none; }
  .secenekler span { display: block; text-align: center; padding: 10px 6px; border: 1px solid #cfd5de; border-radius: 10px; cursor: pointer; font-size: 14px; }
  .secenekler input:checked + span { background: var(--ana); color: #fff; border-color: var(--ana); }
  .onay { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .onay input { width: 22px; height: 22px; }
  .ipucu { font-size: 13px; color: var(--soluk); margin: -6px 0 12px; }

  #perde { position: fixed; inset: 0; background: rgba(15,20,30,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #pencere { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  #pencere .ust { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: sticky; top: -16px;
    background: var(--bg); padding: 4px 0 8px; z-index: 2; }
  #pencere .ust h2 { margin: 0; }
  #pencere .kapat { background: #e3e7ee; border: 0; border-radius: 99px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
  @media (min-width: 800px) { #perde { align-items: center; } #pencere { border-radius: 18px; } }

  #bildirim { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #1d2330; color: #fff;
    padding: 10px 16px; border-radius: 12px; z-index: 40; max-width: 90%; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  #yukleniyor { position: fixed; inset: 0; background: rgba(255,255,255,.55); z-index: 50; display: flex; align-items: center; justify-content: center; }
  #yukleniyor div { background: #1d2330; color: #fff; padding: 12px 18px; border-radius: 12px; }

  .giris { max-width: 420px; margin: 8vh auto 0; padding: 0 16px; }
  .giris h1 { font-size: 24px; margin: 0 0 4px; }
  iframe.onizleme { width: 100%; height: 60vh; border: 1px solid var(--cizgi); border-radius: 10px; background: #fff; }
  .ay-sec { display: flex; align-items: center; justify-content: space-between; background: var(--kart); border-radius: 14px; padding: 6px; margin-bottom: 12px; }
  .ay-sec button { background: #eef1f6; border: 0; border-radius: 10px; width: 44px; height: 38px; font-size: 18px; cursor: pointer; }
  .ay-sec strong { font-size: 17px; }
  .hareket-tutar { font-weight: 700; white-space: nowrap; }
  a { color: var(--ana); }
</style>
</head>
<body>

<div id="girisEkrani" class="giris gizli"></div>

<div id="uygulama" class="gizli">
  <header>
    <h1 id="baslik">Apartman Yönetimi</h1>
    <button onclick="yenile()" title="Yenile">↻</button>
    <button onclick="sayfa('ayarlar')" title="Ayarlar">⚙</button>
  </header>
  <main id="icerik"></main>
  <nav>
    <button data-s="ozet" onclick="sayfa('ozet')"><span>🏠</span>Özet</button>
    <button data-s="daireler" onclick="sayfa('daireler')"><span>🚪</span>Daireler</button>
    <button data-s="giderler" onclick="sayfa('giderler')"><span>🧾</span>Giderler</button>
    <button data-s="aidat" onclick="sayfa('aidat')"><span>💰</span>Aidat</button>
    <button data-s="raporlar" onclick="sayfa('raporlar')"><span>📄</span>Raporlar</button>
  </nav>
</div>

<div id="perde" class="gizli" onclick="if (event.target === this) kapat()"><div id="pencere"></div></div>
<div id="bildirim" class="gizli"></div>
<div id="yukleniyor" class="gizli"><div>Lütfen bekleyin…</div></div>

<script>
// ================================================================ temel yardımcılar
var D = null;            // bütün veriler
var JETON = null;
var AKTIF = 'ozet';
var SECILI_DONEM = null; // giderler sayfası
var AYLAR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sayi(v) {
  if (typeof v === 'number') return v;
  var s = String(v === undefined || v === null ? '' : v).trim().replace(/\s/g, '').replace(/TL/i, '');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  return Number(s);
}
function yuvarla(x) { return Math.round(x * 100) / 100; }
function para(x) {
  return (yuvarla(x) || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
}
function paraKisa(x) {
  var y = yuvarla(x) || 0;
  return y.toLocaleString('tr-TR', { minimumFractionDigits: y % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' TL';
}
function iki(n) { return (n < 10 ? '0' : '') + n; }
function bugun() { var d = new Date(); return d.getFullYear() + '-' + iki(d.getMonth() + 1) + '-' + iki(d.getDate()); }
function buDonem() { return bugun().slice(0, 7); }
function donemAdi(d) { if (!d) return ''; var p = d.split('-'); return AYLAR[Number(p[1]) - 1] + ' ' + p[0]; }
function donemKaydir(d, n) {
  var p = d.split('-'), y = Number(p[0]), a = Number(p[1]) - 1 + n;
  y += Math.floor(a / 12); a = ((a % 12) + 12) % 12;
  return y + '-' + iki(a + 1);
}
function tarihYaz(t) { if (!t) return ''; var p = t.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function uid() { return Math.random().toString(16).slice(2, 10); }
function donemler(bas, son) { var r = []; for (var d = bas; d <= son; d = donemKaydir(d, 1)) r.push(d); return r; }

function bildir(m, sure) {
  var b = $('bildirim'); b.textContent = m; b.classList.remove('gizli');
  clearTimeout(bildir.t); bildir.t = setTimeout(function () { b.classList.add('gizli'); }, sure || 2600);
}
function bekle(acik) { $('yukleniyor').classList.toggle('gizli', !acik); }

function api(fonk) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (tamam, hata) {
    google.script.run.withSuccessHandler(tamam).withFailureHandler(function (e) {
      var m = (e && e.message) || String(e);
      if (m.indexOf('OTURUM:') >= 0) { JETON = null; try { sessionStorage.removeItem('jeton'); } catch (x) {} girisGoster(); }
      hata(new Error(m.replace(/^.*?OTURUM:\s*/, '').replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
    })[fonk].apply(null, args);
  });
}

/** Sunucuya kayıt işlemleri gönderir, sonucu yerel veriye uygular. */
function islem(islemler, mesaj) {
  if (!islemler.length) return Promise.resolve();
  bekle(true);
  return api('islemYap', JETON, islemler).then(function (sonuc) {
    sonuc.forEach(function (s) {
      var t = D[s.tablo];
      if (s.silindi) { D[s.tablo] = t.filter(function (k) { return k.id !== s.silindi; }); return; }
      var i = t.findIndex(function (k) { return k.id === s.kayit.id; });
      if (i >= 0) t[i] = s.kayit; else t.push(s.kayit);
    });
    bekle(false);
    if (mesaj) bildir(mesaj);
    ciz();
  }).catch(function (e) { bekle(false); alert('Kaydedilemedi: ' + e.message); throw e; });
}

// ================================================================ hesaplar
function ayar(a, v) { return D.ayarlar[a] !== undefined && D.ayarlar[a] !== '' ? D.ayarlar[a] : v; }
function aktifDaireler() { return D.Daireler.filter(function (d) { return d.aktif; }).sort(daireSira); }
function tumDaireler() { return D.Daireler.slice().sort(daireSira); }
function daireSira(a, b) {
  var x = Number(a.no), y = Number(b.no);
  if (!isNaN(x) && !isNaN(y)) return x - y;
  return String(a.no).localeCompare(String(b.no), 'tr');
}
function daire(id) { return D.Daireler.find(function (d) { return d.id === id; }); }
function daireAdi(d) { return 'Daire ' + d.no; }
function sakin(id) { return D.Sakinler.find(function (s) { return s.id === id; }); }
function aktifSakin(daireId) {
  var l = D.Sakinler.filter(function (s) { return s.daire_id === daireId && !s.cikis; });
  l.sort(function (a, b) { return String(b.giris).localeCompare(String(a.giris)); });
  return l[0] || null;
}
function odeyenAdi(sakinId, d) {
  var s = sakin(sakinId);
  if (s) return s.ad;
  return d && d.ev_sahibi_ad ? d.ev_sahibi_ad + ' (ev sahibi)' : 'Boş daire / ev sahibi';
}
function oturanAdi(d) {
  var s = aktifSakin(d.id);
  if (s) return s.ad + (s.tip === 'Ev sahibi' ? '' : '');
  return d.ev_sahibi_ad ? d.ev_sahibi_ad + ' (boş, ev sahibi)' : 'Boş';
}
function oturanTel(d) { var s = aktifSakin(d.id); return s ? s.tel : d.ev_sahibi_tel; }

function tarifeTutari(donem) {
  var hepsi = D.AidatTarifesi.slice().sort(function (a, b) { return a.baslangic_donem.localeCompare(b.baslangic_donem); });
  var t = hepsi.filter(function (x) { return x.baslangic_donem <= donem; });
  if (t.length) return t[t.length - 1].tutar;
  return hepsi.length ? hepsi[0].tutar : 0; // ilk tarifeden önceki aylar için ilk tutar geçerli
}
function aidatTutari(donem, d) {
  if (d.ozel_aidat !== '' && d.ozel_aidat !== null && d.ozel_aidat !== undefined && !isNaN(d.ozel_aidat)) return d.ozel_aidat;
  return tarifeTutari(donem);
}

function borcSira(a, b) { return (a.donem + (a.tarih || '')).localeCompare(b.donem + (b.tarih || '')) || (a.tur === 'Aidat' ? -1 : 1); }

/**
 * Bir dairenin hesabı. Ödemeler, aynı kişinin (sakin) borçlarına eskiden yeniye doğru dağıtılır.
 * bakiye > 0: alacaklı (fazla / ön ödeme), bakiye < 0: borçlu.
 */
function hesap(daireId) {
  var borclar = D.Borclar.filter(function (b) { return b.daire_id === daireId; }).map(function (b) { return Object.assign({}, b, { kalan: b.tutar }); });
  var odemeler = D.Odemeler.filter(function (o) { return o.daire_id === daireId; });
  var kisiler = {};
  borclar.forEach(function (b) { (kisiler[b.sakin_id] = kisiler[b.sakin_id] || { borc: 0, odeme: 0, borclar: [] }).borc += b.tutar; kisiler[b.sakin_id].borclar.push(b); });
  odemeler.forEach(function (o) { (kisiler[o.sakin_id] = kisiler[o.sakin_id] || { borc: 0, odeme: 0, borclar: [] }).odeme += o.tutar; });
  Object.keys(kisiler).forEach(function (k) {
    var kisi = kisiler[k], kalanOdeme = kisi.odeme;
    kisi.borclar.sort(borcSira);
    kisi.borclar.forEach(function (b) { var p = Math.max(0, Math.min(b.kalan, kalanOdeme)); b.kalan = yuvarla(b.kalan - p); kalanOdeme -= p; });
    kisi.bakiye = yuvarla(kisi.odeme - kisi.borc);
    kisi.acik = kisi.borclar.filter(function (b) { return b.kalan > 0.004; });
  });
  var s = aktifSakin(daireId), aktifId = s ? s.id : '';
  var ana = kisiler[aktifId] || { borc: 0, odeme: 0, borclar: [], bakiye: 0, acik: [] };
  var eskiler = Object.keys(kisiler).filter(function (k) { return k !== aktifId && Math.abs(kisiler[k].bakiye) > 0.004; })
    .map(function (k) { return { sakin_id: k, ad: odeyenAdi(k, daire(daireId)), bakiye: kisiler[k].bakiye, acik: kisiler[k].acik }; });
  var toplam = yuvarla(odemeler.reduce(function (t, o) { return t + o.tutar; }, 0) - borclar.reduce(function (t, b) { return t + b.tutar; }, 0));
  return { bakiye: ana.bakiye, acik: ana.acik, eskiler: eskiler, toplam: toplam, aktifSakinId: aktifId };
}

function durumEtiketi(bakiye) {
  if (bakiye < -0.004) return '<span class="etiket borc">Borç ' + paraKisa(-bakiye) + '</span>';
  if (bakiye > 0.004) return '<span class="etiket alacak">Alacak +' + paraKisa(bakiye) + '</span>';
  return '<span class="etiket tamam">Borcu yok ✓</span>';
}
function durumYazi(bakiye) {
  if (bakiye < -0.004) return 'Borç: ' + para(-bakiye);
  if (bakiye > 0.004) return 'Alacak (ön ödeme): +' + para(bakiye);
  return 'Borcu yok';
}

function kasa(sonTarih) {
  var banka = sayi(ayar('acilis_banka', 0)) || 0, nakit = sayi(ayar('acilis_nakit', 0)) || 0;
  D.Odemeler.forEach(function (o) { if (sonTarih && o.tarih > sonTarih) return; if (o.yontem === 'Nakit') nakit += o.tutar; else banka += o.tutar; });
  D.Giderler.forEach(function (g) { if (sonTarih && g.tarih > sonTarih) return; if (g.odeme === 'Nakit') nakit -= g.tutar; else banka -= g.tutar; });
  return { banka: yuvarla(banka), nakit: yuvarla(nakit), toplam: yuvarla(banka + nakit) };
}
function ayinSonGunu(donem) { var p = donem.split('-'); var g = new Date(Number(p[0]), Number(p[1]), 0).getDate(); return donem + '-' + iki(g); }
function donemOzeti(donem) {
  var istenen = D.Borclar.filter(function (b) { return b.donem === donem; });
  var odemeler = D.Odemeler.filter(function (o) { return o.tarih && o.tarih.slice(0, 7) === donem; });
  var giderler = D.Giderler.filter(function (g) { return g.donem === donem; });
  return {
    aidatIstenen: yuvarla(istenen.filter(function (b) { return b.tur === 'Aidat'; }).reduce(function (t, b) { return t + b.tutar; }, 0)),
    ekIstenen: yuvarla(istenen.filter(function (b) { return b.tur !== 'Aidat'; }).reduce(function (t, b) { return t + b.tutar; }, 0)),
    toplanan: yuvarla(odemeler.reduce(function (t, o) { return t + o.tutar; }, 0)),
    harcanan: yuvarla(giderler.reduce(function (t, g) { return t + g.tutar; }, 0)),
    odemeler: odemeler, giderler: giderler, borclar: istenen
  };
}
/** Bir ayın aidat borcunun ne kadarı ödendi (FIFO dağıtımına göre). */
function donemTahsilat(donem) {
  var istenen = 0, kalan = 0;
  aktifVeyaKayitli(donem).forEach(function (d) {
    var h = hesap(d.id);
    D.Borclar.filter(function (b) { return b.daire_id === d.id && b.donem === donem; }).forEach(function (b) {
      istenen += b.tutar;
      var ac = h.acik.concat([].concat.apply([], h.eskiler.map(function (e) { return e.acik; }))).find(function (x) { return x.id === b.id; });
      kalan += ac ? ac.kalan : 0;
    });
  });
  return { istenen: yuvarla(istenen), odenen: yuvarla(istenen - kalan), kalan: yuvarla(kalan) };
}
function aktifVeyaKayitli(donem) {
  return tumDaireler().filter(function (d) { return d.aktif || D.Borclar.some(function (b) { return b.daire_id === d.id && b.donem === donem; }); });
}

// ================================================================ otomatik işlemler
/** Başlangıçtan bu aya kadar yazılmamış aidatları yazar. */
function aidatlariYaz() {
  var bas = ayar('baslangic_donem', buDonem()), son = buDonem(), islemler = [], sayac = {};
  aktifDaireler().forEach(function (d) {
    var b = d.baslangic_donem && d.baslangic_donem > bas ? d.baslangic_donem : bas;
    donemler(b, son).forEach(function (m) {
      var var_ = D.Borclar.some(function (x) { return x.daire_id === d.id && x.donem === m && x.tur === 'Aidat'; });
      var tutar = aidatTutari(m, d);
      if (var_ || !(tutar > 0)) return;
      var s = aktifSakin(d.id);
      islemler.push({ tablo: 'Borclar', kayit: { id: uid(), daire_id: d.id, sakin_id: s ? s.id : '', donem: m, tur: 'Aidat',

}

/** Bir dairenin bütün hareketleri, yürüyen bakiyeyle (en yeni üstte). */
function dairehareketleri(id) {
  var l = D.Borclar.filter(function (b) { return b.daire_id === id; }).map(function (b) {
    return { tarih: b.tarih || (b.donem + '-01'), sira: 0, ad: b.baslik, tutar: -b.tutar, kisi: b.sakin_id, borc: b };
  }).concat(D.Odemeler.filter(function (o) { return o.daire_id === id; }).map(function (o) {
    return { tarih: o.tarih, sira: 1, ad: o.tutar < 0 ? 'İade' + (o.aciklama ? ' – ' + o.aciklama : '') : 'Ödeme (' + o.yontem + ')' + (o.aciklama ? ' – ' + o.aciklama : ''), tutar: o.tutar, kisi: o.sakin_id, odeme: o };
  }));
  l.sort(function (a, b) { return a.tarih.localeCompare(b.tarih) || a.sira - b.sira; });
  var bakiye = 0;
  l.forEach(function (x) { bakiye = yuvarla(bakiye + x.tutar); x.bakiye = bakiye; });

  var simdi = tarifeTutari(buDonem());
  var gelecek = D.AidatTarifesi.filter(function (t) { return t.baslangic_donem > buDonem(); }).sort(function (a, b) { return a.baslangic_donem.localeCompare(b.baslangic_donem); });
  var ozel = aktifDaireler().filter(function (d) { return d.ozel_aidat !== '' && d.ozel_aidat !== null && !isNaN(d.ozel_aidat); });
  var h = '<h2>Aidat</h2><div class="kart"><div class="soluk">Aylık aidat (her daire)</div><div class="buyuk">' + para(simdi) + '</div>' +
    (gelecek.length ? '<div class="turuncu kucuk">' + donemAdi(gelecek[0].baslangic_donem) + ' itibarıyla ' + paraKisa(gelecek[0].tutar) + ' olacak.</div>' : '') +
    (ozel.length ? '<div class="soluk kucuk">Özel aidatlı daireler: ' + esc(ozel.map(function (d) { return daireAdi(d) + ' ' + paraKisa(d.ozel_aidat); }).join(', ')) + '</div>' : '') +
    '<div class="soluk kucuk" style="margin-top:6px">Aidatlar her ay başında, program ilk açıldığında bütün dairelere kendiliğinden yazılır. Ön ödemesi olan dairelerde bakiyeden düşer.</div>' +
    '<div class="dugmeler"><button class="btn ana" onclick="tarifeFormu()">Aidatı değiştir</button></div></div>';
  h += '<h3>Aidat geçmişi</h3><div class="liste">';
  D.AidatTarifesi.slice().sort(function (a, b) { return b.baslangic_donem.localeCompare(a.baslangic_donem); }).forEach(function (t) {
    h += '<div><div class="satir"><span>' + donemAdi(t.baslangic_donem) + ' itibarıyla' + (t.aciklama ? '<span class="soluk kucuk"> · ' + esc(t.aciklama) + '</span>' : '') + '</span><strong>' + paraKisa(t.tutar) + '</strong></div></div>';
  });
  h += '</div><h3>Ek toplamalar</h3><div class="kart bilgi kucuk">Asansör tamiri, boya, kapı değişimi gibi aidatın karşılamadığı işler için dairelerden ayrıca para toplamak için kullanın. Tutar dairelere bölünür ve hesaplarına borç olarak yazılır.</div>' +
    '<button class="btn ana tam" onclick="ekFormu()">＋ Yeni ek toplama</button><div class="liste" style="margin-top:12px">';
  var ekler = D.EkToplamalar.slice().sort(function (a, b) { return String(b.tarih).localeCompare(String(a.tarih)); });
  if (!ekler.length) h += '<div class="bos">Ek toplama yok.</div>';
  ekler.forEach(function (e) {
    var bl = D.Borclar.filter(function (b) { return b.ek_id === e.id; });
    h += '<div class="tikla" onclick="ekDetay(\'' + e.id + '\')"><div class="satir"><div><strong>' + esc(e.baslik) + '</strong><div class="soluk kucuk">' + donemAdi(e.donem) + ' · ' + bl.length + ' daire</div></div><span class="hareket-tutar">' + paraKisa(e.toplam) + '</span></div></div>';
  });
  return h + '</div>';
};

function tarifeFormu() {
  var h = '<div class="kart">' + alan('tTutar', 'Yeni aylık aidat (TL)', '', String(tarifeTutari(buDonem())), 'decimal') +
    '<label class="alan"><span>Hangi aydan itibaren?</span><input id="tDonem" type="month" value="' + donemKaydir(buDonem(), 1) + '"></label>' +
    alan('tAciklama', 'Açıklama (isteğe bağlı)', '', 'örn. Toplantı kararı') +
    '<p class="ipucu">Seçtiğiniz aydan önceki aidatlar değişmez. Seçilen ay zaten yazılmışsa o ayın aidatları da yeni tutara güncellenir (özel aidatlı daireler hariç).</p>' +
    '<button class="btn ana tam" onclick="tarifeKaydet()">Kaydet</button></div>';
  pencere('Aidatı değiştir', h);
}
function tarifeKaydet() {
  var tutar = sayi(deger('tTutar')), donem = deger('tDonem');
  if (!(tutar >= 0) || !donem) return alert('Tutarı ve ayı yazın.');
  var islemler = [], ayni = D.AidatTarifesi.find(function (t) { return t.baslangic_donem === donem; });
  islemler.push({ tablo: 'AidatTarifesi', kayit: { id: ayni ? ayni.id : uid(), baslangic_donem: donem, tutar: tutar, aciklama: deger('tAciklama') } });
  var sonra = D.AidatTarifesi.filter(function (t) { return t.baslangic_donem > donem; }).map(function (t) { return t.baslangic_donem; }).sort()[0];
  D.Borclar.filter(function (b) { return b.tur === 'Aidat' && b.donem >= donem && (!sonra || b.donem < sonra); }).forEach(function (b) {
    var d = daire(b.daire_id);
    if (d && (d.ozel_aidat === '' || d.ozel_aidat === null || isNaN(d.ozel_aidat))) islemler.push({ tablo: 'Borclar', kayit: Object.assign({}, b, { tutar: tutar }) });
  });
  islem(islemler, 'Aidat güncellendi').then(function () { kapat(); aidatlariYaz(); });
}

function ekFormu(id) {
  var e = id ? D.EkToplamalar.find(function (x) { return x.id === id; }) : null;
  var secili = e ? String(e.daireler).split(',') : aktifDaireler().map(function (d) { return d.id; });
  var dl = tumDaireler().filter(function (d) { return d.aktif || secili.indexOf(d.id) >= 0; }).map(function (d) {
    return '<label class="onay"><input type="checkbox" class="eDaire" value="' + d.id + '"' + (secili.indexOf(d.id) >= 0 ? ' checked' : '') + ' onchange="ekOnizle()"> <span>' + esc(daireAdi(d) + ' · ' + oturanAdi(d)) + '</span></label>';
  }).join('');
  var h = '<div class="kart">' + alan('eBaslik', 'Ne için?', e ? e.baslik : '', 'örn. Asansör motor tamiri') +
    '<label class="alan"><span>Açıklama (raporda görünür)</span><textarea id="eAciklama" placeholder="örn. Asansör motoru arızalandı, 3 firmadan teklif alındı, en uygunu seçildi.">' + esc(e ? e.aciklama : '') + '</textarea></label>' +
    '<label class="alan"><span>Tutar nasıl girilsin?</span><div class="secenekler"><label><input type="radio" name="eGiris" value="toplam" checked onchange="ekOnizle()"><span>Toplam tutar</span></label>' +
    '<label><input type="radio" name="eGiris" value="daire" onchange="ekOnizle()"><span>Daire başı tutar</span></label></div></label>' +
    alan('eTutar', 'Tutar (TL)', e ? String(e.toplam).replace('.', ',') : '', '', 'decimal', ' oninput="ekOnizle()"') +
    '<label class="alan"><span>Nasıl bölünsün?</span><div class="secenekler"><label><input type="radio" name="eDagitim" value="esit"' + (!e || e.dagitim !== 'oran' ? ' checked' : '') + ' onchange="ekOnizle()"><span>Eşit</span></label>' +
    '<label><input type="radio" name="eDagitim" value="oran"' + (e && e.dagitim === 'oran' ? ' checked' : '') + ' onchange="ekOnizle()"><span>Pay oranına göre</span></label></div></label>' +
    '<label class="alan"><span>Hangi aya yazılsın?</span><input id="eDonem" type="month" value="' + (e ? e.donem : buDonem()) + '"></label>' +
    '<label class="alan"><span>Katılan daireler</span></label>' + dl +
    '<div id="eOnizleme" class="kart bilgi kucuk" style="margin-top:10px"></div>' +
    '<button class="btn ana tam" onclick="ekKaydet(\'' + (id || '') + '\')">' + (e ? 'Güncelle' : 'Dairelere paylaştır') + '</button></div>';
  pencere(e ? 'Ek toplamayı düzenle' : 'Yeni ek toplama', h);
  ekOnizle();
}
function ekDagit() {
  var secili = Array.prototype.slice.call(document.querySelectorAll('.eDaire:checked')).map(function (x) { return x.value; });
  var tutar = sayi(deger('eTutar')), oran = document.querySelector('input[name="eDagitim"]:checked').value === 'oran';
  var daireBasi = document.querySelector('input[name="eGiris"]:checked').value === 'daire';
  if (!(tutar > 0) || !secili.length) return null;
  var paylar = secili.map(function (id) { var d = daire(id); return oran ? (Number(d.pay_orani) >= 0 ? Number(d.pay_orani) : 1) : 1; });
  var toplamPay = paylar.reduce(function (t, p) { return t + p; }, 0);
  if (!(toplamPay > 0)) return null;
  var toplam = daireBasi ? yuvarla(tutar * (oran ? toplamPay : secili.length)) : tutar;
  var dagilim = [], dagitilan = 0;
  secili.forEach(function (id, i) {
    var t = i === secili.length - 1 ? yuvarla(toplam - dagitilan) : yuvarla(toplam * paylar[i] / toplamPay);
    dagitilan = yuvarla(dagitilan + t);
    dagilim.push({ daire_id: id, tutar: t });
  });
  return { toplam: toplam, dagilim: dagilim, oran: oran };
}
function ekOnizle() {
  var r = ekDagit(), el = $('eOnizleme');
  if (!el) return;
  if (!r) { el.innerHTML = 'Tutarı yazın ve en az bir daire seçin.'; return; }
  el.innerHTML = '<strong>Toplam ' + para(r.toplam) + '</strong><br>' + r.dagilim.map(function (x) { return esc(daireAdi(daire(x.daire_id))) + ': ' + paraKisa(x.tutar); }).join(' · ');
}
function ekKaydet(id) {
  var r = ekDagit();
  if (!deger('eBaslik')) return alert('Ne için toplandığını yazın.');
  if (!r) return alert('Tutarı yazın ve en az bir daire seçin.');
  var donem = deger('eDonem') || buDonem(), ekId = id || uid(), t = bugun();
  var islemler = [{ tablo: 'EkToplamalar', kayit: { id: ekId, tarih: id ? (D.EkToplamalar.find(function (x) { return x.id === id; }).tarih) : t, donem: donem,
    baslik: deger('eBaslik'), aciklama: $('eAciklama').value, toplam: r.toplam, dagitim: r.oran ? 'oran' : 'esit', daireler: r.dagilim.map(function (x) { return x.daire_id; }).join(',') } }];
  var eskiler = D.Borclar.filter(function (b) { return b.ek_id === ekId; });
  r.dagilim.forEach(function (x) {
    var eski = eskiler.find(function (b) { return b.daire_id === x.daire_id; });
    var s = aktifSakin(x.daire_id);
    islemler.push({ tablo: 'Borclar', kayit: { id: eski ? eski.id : uid(), daire_id: x.daire_id, sakin_id: eski ? eski.sakin_id : (s ? s.id : ''), donem: donem,
      tur: 'Ek toplama', baslik: deger('eBaslik'), tutar: x.tutar, ek_id: ekId, tarih: eski ? eski.tarih : t } });
  });
  eskiler.filter(function (b) { return !r.dagilim.some(function (x) { return x.daire_id === b.daire_id; }); }).forEach(function (b) { islemler.push({ tablo: 'Borclar', sil: b.id }); });
  islem(islemler, id ? 'Ek toplama güncellendi' : 'Dairelere paylaştırıldı').then(function () { ekDetay(ekId); });
}
function ekDetay(id) {
  var e = D.EkToplamalar.find(function (x) { return x.id === id; });
  if (!e) return kapat();
  var bl = D.Borclar.filter(function (b) { return b.ek_id === id; });
  var h = '<div class="kart"><div class="orta">' + para(e.toplam) + '</div><div class="soluk">' + donemAdi(e.donem) + ' · ' + (e.dagitim === 'oran' ? 'pay oranına göre' : 'eşit') + ' bölündü</div>' +
    (e.aciklama ? '<p>' + esc(e.aciklama) + '</p>' : '') + '</div><div class="liste">';
  bl.forEach(function (b) {
    var d = daire(b.daire_id), hs = hesap(b.daire_id);
    var ac = hs.acik.concat([].concat.apply([], hs.eskiler.map(function (x) { return x.acik; }))).find(function (x) { return x.id === b.id; });
    h += '<div><div class="satir"><span>' + esc(daireAdi(d)) + ' · ' + esc(odeyenAdi(b.sakin_id, d)) + '</span><span>' + paraKisa(b.tutar) + ' ' +
      (ac ? '<span class="etiket borc">kalan ' + paraKisa(ac.kalan) + '</span>' : '<span class="etiket alacak">ödendi</span>') + '</span></div></div>';
  });
  h += '</div><div class="izgara2"><button class="btn cerceve" onclick="raporAc(\'ek\', \'' + id + '\')">📄 Duyuru PDF</button>' +
    '<a class="btn yesil" target="_blank" href="' + esc('https://wa.me/?text=' + encodeURIComponent(ekDuyuruMetni(e))) + '">💬 Gruba duyur</a>' +
    '<button class="btn cerceve" onclick="ekFormu(\'' + id + '\')">✏ Düzenle</button><button class="btn kirmizi" onclick="ekSil(\'' + id + '\')">Sil</button></div>';
  pencere(e.baslik, h);
}
function ekDuyuruMetni(e) {
  var bl = D.Borclar.filter(function (b) { return b.ek_id === e.id; });
  var esit = bl.every(function (b) { return Math.abs(b.tutar - bl[0].tutar) < 0.01; });
  var t = 'Sayın ' + ayar('apartman_adi', 'apartman') + ' sakinleri,\n\n' + e.baslik + ' için toplam ' + para(e.toplam) + ' gerekmektedir.\n';
  if (e.aciklama) t += e.aciklama + '\n';
  t += '\n' + (esit && bl.length ? 'Daire başına düşen pay: ' + para(bl[0].tutar) + '\n' : bl.map(function (b) { return daireAdi(daire(b.daire_id)) + ': ' + paraKisa(b.tutar); }).join('\n') + '\n');
  t += 'Bu tutar ' + donemAdi(e.donem) + ' aidatıyla birlikte hesabınıza yazılmıştır.\n';
  if (ayar('iban', '')) t += '\nIBAN: ' + ayar('iban', '') + (ayar('iban_ad', '') ? ' (' + ayar('iban_ad', '') + ')' : '') + '\n';
  return t + '\nTeşekkürler,\n' + ayar('yonetici_ad', 'Apartman Yönetimi');
}
function ekSil(id) {
  if (!confirm('Bu ek toplama ve dairelere yazılan payları silinsin mi? (Alınmış ödemeler silinmez, dairelerin bakiyesine alacak olarak geçer.)')) return;
  islem([{ tablo: 'EkToplamalar', sil: id }].concat(D.Borclar.filter(function (b) { return b.ek_id === id; }).map(function (b) { return { tablo: 'Borclar', sil: b.id }; })), 'Silindi').then(kapat);
}

  donemler(bas < m ? bas : m, m).reverse().forEach(function (d) { aylar += '<option value="' + d + '">' + donemAdi(d) + '</option>'; yillar[d.slice(0, 4)] = 1; });
  var daireler = tumDaireler().map(function (d) { return '<option value="' + d.id + '">' + esc(daireAdi(d) + ' · ' + oturanAdi(d)) + '</option>'; }).join('');
  return '<h2>Raporlar</h2><div class="kart bilgi kucuk">Raporlar herkesin anlayacağı sade bir dille hazırlanır. Önce önizleyin, sonra PDF oluşturup WhatsApp grubuna gönderin.</div>' +
    '<div class="kart"><strong>📅 Aylık rapor</strong><div class="soluk kucuk">O ay ne toplandı, ne harcandı, kasada ne kaldı, hangi daire ödedi.</div>' +

    '<button class="btn ana tam" onclick="raporAc(\'yillik\', $(\'rYil\').value)">Önizle</button></div>' +
    '<div class="kart"><strong>🚪 Daire hesap dökümü</strong><div class="soluk kucuk">Bir dairenin bütün aidat, ödeme ve bakiye geçmişi.</div>' +
    '<label class="alan" style="margin-top:10px"><select id="rDaire">' + daireler + '</select></label><button class="btn ana tam" onclick="raporAc(\'dokum\', $(\'rDaire\').value)">Önizle</button></div>' +

    '<button class="btn ana tam" style="margin-top:10px" onclick="raporAc(\'borclar\')">Önizle</button></div>' +

};

var RAPOR = null;
function raporAc(tur, arg) {
  var r = RAPORLAR[tur](arg);
  RAPOR = r;
  var h = '<iframe class="onizleme" id="rOnizleme"></iframe><div class="dugmeler"><button class="btn ana" onclick="raporPdf()">📄 PDF oluştur</button>' +
    (r.wa ? '<a class="btn yesil" target="_blank" href="' + esc(r.wa) + '">💬 WhatsApp metni</a>' : '') + '</div><div id="rSonuc"></div>';
  pencere(r.baslik, h);
  $('rOnizleme').srcdoc = r.html;
}
function raporPdf() {
  bekle(true);
  api('pdfOlustur', JETON, RAPOR.html, RAPOR.dosya).then(function (f) {
    bekle(false);
    $('rSonuc').innerHTML = '<div class="kart bilgi"><strong>PDF hazır ✓</strong><div class="soluk kucuk">Google Drive\'da “Apartman Yönetimi / Raporlar” klasörüne kaydedildi. Açıp paylaş düğmesiyle WhatsApp\'a gönderebilirsiniz.</div>' +
      '<div class="dugmeler"><a class="btn ana" target="_blank" href="' + esc(f.url) + '">PDF\'i aç</a><a class="btn cerceve" target="_blank" href="' + esc(f.indir) + '">İndir</a></div></div>';
  }).catch(function (e) { bekle(false); alert('PDF oluşturulamadı: ' + e.message); });
}

function rTablo(basliklar, satirlar, hizalar, toplamSatiri) {

  return h + '</table>';
}
function apAdi() { return ayar('apartman_adi', 'Apartman'); }

var RAPORLAR = {};

RAPORLAR.aylik = function (donem) {
  var o = donemOzeti(donem), t = donemTahsilat(donem);
  var onceki = kasa(ayinSonGunu(donemKaydir(donem, -1))), sonra = kasa(ayinSonGunu(donem));
  var giren = yuvarla(o.odemeler.reduce(function (s, x) { return s + x.tutar; }, 0));
  var aidat = aktifDaireler().length ? aidatTutari(donem, aktifDaireler()[0]) : 0;
  var ekler = D.EkToplamalar.filter(function (e) { return e.donem === donem; });
  var kat = {};
  o.giderler.forEach(function (g) { kat[g.kategori] = (kat[g.kategori] || 0) + g.tutar; });
  var enBuyuk = Object.keys(kat).sort(function (a, b) { return kat[b] - kat[a]; });

  var g = '<div class="kutu"><b>Kısaca:</b> ' + donemAdi(donem) + ' ayında her daireden <b>' + para(aidat) + '</b> aidat istendi' +
    (o.ekIstenen ? ', ayrıca ek toplama olarak toplam <b>' + para(o.ekIstenen) + '</b> paylaştırıldı' : '') + '. ' +
