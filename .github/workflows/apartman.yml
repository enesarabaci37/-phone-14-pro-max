name: Apartman Yonetimi - Windows programi

on:
  push:
    paths:
      - "apartman/**"
      - ".github/workflows/apartman.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        run: python -m pip install pyinstaller reportlab

      - name: Programi derle
        working-directory: apartman
        run: >
          pyinstaller apartman.py --onedir --windowed --noconfirm --noupx
          --version-file version.txt
          --name Apartman-Yonetimi
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --add-data "fonts;fonts"

      - name: Zip olarak paketle
        working-directory: apartman/dist
        run: Compress-Archive -Path Apartman-Yonetimi -DestinationPath Apartman-Yonetimi.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Apartman-Yonetimi
          path: apartman/dist/Apartman-Yonetimi.zip

      - name: Indirme sayfasina (Releases) yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apartman-v${{ github.run_number }}
          name: Apartman Yönetimi v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apartman/dist/Apartman-Yonetimi.zip
          body: |
            Apartman Yönetimi programı (Windows).
            1. Aşağıdaki **Apartman-Yonetimi.zip** dosyasını indirin.
            2. Zip dosyasına sağ tıklayıp **Tümünü ayıkla** deyin, çıkan **Apartman-Yonetimi** klasörünü Belgeler gibi kalıcı bir yere koyun.
            3. Klasördeki **Apartman-Yonetimi.exe** dosyasına sağ tık → Gönder → Masaüstü (kısayol oluştur).
