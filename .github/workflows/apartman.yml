name: Apartman Yonetimi - Windows programi

on:
  push:
    paths:
      - "apartman/**"
      - ".github/workflows/apartman.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        run: python -m pip install pyinstaller reportlab

      - name: Programi derle
        working-directory: apartman
        run: >
          pyinstaller apartman.py --onefile --windowed --noconfirm
          --name Apartman-Yonetimi
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --add-data "fonts;fonts"

      - uses: actions/upload-artifact@v4
        with:
          name: Apartman-Yonetimi
          path: apartman/dist/Apartman-Yonetimi.exe

      - name: Indirme sayfasina (Releases) yukle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apartman-v${{ github.run_number }}
          name: Apartman Yönetimi v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apartman/dist/Apartman-Yonetimi.exe
          body: |
            Apartman Yönetimi programı (Windows).
            Aşağıdaki **Apartman-Yonetimi.exe** dosyasını indirip çift tıklayın, kurulum gerekmez.
